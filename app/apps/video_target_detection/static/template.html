      <section id="page-video-target-detection" class="page hidden" data-page="video-target-detection">
        <header class="page-header">
          <h2>视频目标监控</h2>
          <button class="wizard-mode-btn" data-wizard-mode data-page-id="video-target-detection">向导模式</button>
          <button class="refresh-btn" data-refresh>刷新</button>
        </header>

        <div class="vd-layout vtd-layout">
          <div class="vd-stage-col">
            <!-- 画面上方的状态条：两个圆点标签，一眼看出"视频通没通 / 检测跑没跑" -->
            <div class="vtd-stagebar">
              <span class="vtd-pill" id="vtd-pill-video" data-state="idle">
                <i class="vtd-dot"></i><span id="vtd-channel-hint">尚未打开视频</span>
              </span>
              <span class="vtd-pill" id="vtd-pill-det" data-state="idle">
                <i class="vtd-dot"></i><span id="vtd-detector-status">检测未启动</span>
              </span>
            </div>

            <div class="vd-stage vd-grid" id="vtd-grid" data-cols="1">
              <!-- 1~32 格宫格，由 app.js 按通道数重建 -->
              <!-- 提示层放在 grid 内部：absolute 定位不参与网格布局，inset:0 正好罩住画面 -->
              <div class="vd-overlay vtd-overlay" id="vtd-overlay"></div>
            </div>
          </div>

          <aside class="vd-side vtd-side">
            <form class="surv-form" id="vtd-form" autocomplete="off" onsubmit="return false;">
              <section class="surv-form-section">
                <header class="surv-form-head">
                  <h3>视频源</h3>
                </header>
                <div class="surv-field">
                  <textarea id="vtd-sources" class="surv-input surv-textarea vtd-sources"
                            rows="6" spellcheck="false"
                            placeholder="每行一路，最多 32 路&#10;/userdata/assets/720p/rk-0.mp4&#10;rtsp://192.168.1.10:554/stream1"></textarea>
                  <div class="vd-actions-row">
                    <button type="button" class="vd-btn vd-btn-primary" id="vtd-open">打开视频</button>
                    <button type="button" class="vd-btn" id="vtd-close">关闭</button>
                    <label class="vd-loop-toggle" title="文件源播放完后自动从头重播；直播无效">
                      <input type="checkbox" id="vtd-loop" checked />
                      <span>循环播放</span>
                    </label>
                  </div>
                  <div id="vtd-judge-config"></div>
                </div>
              </section>

              <section class="surv-form-section vtd-grow">
                <header class="surv-form-head">
                  <h3>目标检测</h3>
                </header>
                <div class="surv-field">
                  <label class="vtd-label">
                    <span class="vtd-label-k">使用模型</span>
                    <select id="vtd-model-pick" class="surv-input vtd-select"
                            data-capability="swcap_video_describe">
                      <option value="">自动选择</option>
                    </select>
                  </label>

                  <label class="vtd-label">
                    <span class="vtd-label-k">要找什么</span>
                    <textarea id="vtd-prompt" class="surv-input surv-textarea vtd-prompt"
                              placeholder="用一句话描述你要找的目标，例如：画面中走动的人、未戴安全帽的工人"></textarea>
                  </label>

                  <div class="vtd-subrow">
                    <label class="vtd-label vtd-label-inline">
                      <span class="vtd-label-k">巡检间隔</span>
                      <span class="vtd-inline-row">
                        <input type="number" id="vtd-every-n" min="0" max="60" step="1" value="0" />
                        <span class="vtd-label-u">秒/路</span>
                      </span>
                    </label>
                    <label class="vtd-label vtd-label-inline">
                      <span class="vtd-label-k">检测尺寸</span>
                      <select id="vtd-detect-size" class="surv-input vtd-select">
                        <option value="auto" selected>自动选择</option>
                        <option value="384">384x384 (更快)</option>
                        <option value="768">768x768 (更准)</option>
                      </select>
                    </label>
                  </div>
<div class="vd-actions-row">
                    <button type="button" class="vd-btn vd-btn-primary" id="vtd-detector-start">启动检测</button>
                    <button type="button" class="vd-btn" id="vtd-detector-stop" disabled>停止检测</button>
                  </div>
                </div>
              </section>
            </form>
          </aside>
        </div>

        <section class="vd-section vtd-events">
          <header class="vd-section-head">
            <h3>检测记录</h3>
            <span class="vd-spacer"></span>
            <span class="vd-meta" id="vtd-events-count">0 条</span>
            <button id="vtd-events-clear" class="vd-btn">清空</button>
          </header>
          <ol class="vd-event-list" id="vtd-event-list">
            <li class="vd-event-empty">启动检测后，命中的目标会显示在这里。</li>
          </ol>
        </section>

        <details class="raw-output">
          <summary>完整 JSON</summary>
          <pre class="payload" id="data-video-target-detection"></pre>
        </details>
      </section>
